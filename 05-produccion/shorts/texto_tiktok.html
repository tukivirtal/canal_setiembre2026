<!doctype html>
<html><head><meta charset="utf-8">
<!-- Un texto de un video vertical largo para TikTok, transparente, 1080x1920.
     Parámetros: titulo (grande, serif), sub (chico), fuente (la cita), tipo:
       gancho  el primer segundo: grande, arriba
       cita    una línea del Tao Te Ching con su capítulo
       fin     marca y dónde está la obra completa
     tarjetas=1 suma abajo las 3 tarjetas del regalo en abanico (web/img).
     Lo usa 05-produccion/shorts/tiktok_tao.py. Zona segura de TikTok: arriba
     ~200 px, abajo ~500 px (descripción, sonido), derecha ~150 px (botones). -->
<style>
  @font-face{font-family:Inter;font-weight:600;src:url(../miniaturas/fuentes/inter-600-latin.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:800;src:url(../miniaturas/fuentes/inter-800-latin.woff2) format('woff2')}
  @font-face{font-family:Cinzel;font-weight:600;src:url(../miniaturas/fuentes/cinzel-600-normal-latin.woff2) format('woff2')}
  @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;src:url(../../09-canal/fuentes/cormorant-garamond-500-italic-latin.woff2) format('woff2')}
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
  .caja{position:absolute;top:320px;left:90px;right:150px;text-align:center}
  .titulo{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:96px;line-height:1.08;
    color:#f6e7b8;text-wrap:balance;font-variant-numeric:lining-nums;text-shadow:0 4px 30px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.6)}
  .gancho .titulo{font-size:118px}
  .sub{margin-top:30px;white-space:pre-line;font-family:Inter,sans-serif;font-weight:600;font-size:42px;line-height:1.3;color:#fff;
    text-wrap:balance;text-shadow:0 3px 18px rgba(0,0,0,.95)}
  .fuente{margin-top:34px;font-family:Cinzel,serif;font-weight:600;font-size:34px;letter-spacing:.12em;color:#e6c46a;
    text-shadow:0 2px 12px rgba(0,0,0,.95)}
  .abanico{position:absolute;top:800px;left:90px;right:150px;height:600px}
  .abanico img{position:absolute;top:0;left:50%;width:300px;height:533px;margin-left:-150px;border-radius:22px;
    border:2px solid rgba(230,196,106,.45);box-shadow:0 24px 60px rgba(0,0,0,.75)}
  .abanico img:nth-child(1){transform:translateX(-212px) translateY(30px) rotate(-9deg)}
  .abanico img:nth-child(2){z-index:1}
  .abanico img:nth-child(3){transform:translateX(212px) translateY(30px) rotate(9deg)}
  .marca{position:absolute;top:215px;left:90px;right:150px;text-align:center;font-family:Cinzel,serif;font-weight:600;
    font-size:40px;color:#f6e7b8;text-shadow:0 2px 10px rgba(0,0,0,.9)}
</style></head>
<body>
  <div class="caja" id="caja"><div class="titulo" id="titulo"></div><div class="sub" id="sub"></div><div class="fuente" id="fuente"></div></div>
  <div class="abanico" id="abanico"><img src="../../web/img/tarjeta-noche-1.jpg"><img src="../../web/img/tarjeta-noche-2.jpg"><img src="../../web/img/tarjeta-noche-3.jpg"></div>
  <div class="marca" id="marca">Rin</div>
<script>
  const Q = new URLSearchParams(location.search);
  document.getElementById('caja').classList.add(Q.get('tipo') || 'cita');
  for (const k of ['titulo', 'sub', 'fuente']) {
    const v = Q.get(k); const el = document.getElementById(k);
    if (v) el.textContent = v; else el.remove();
  }
  if (Q.get('marca') === '0') document.getElementById('marca').remove();
  if (Q.get('tarjetas') !== '1') document.getElementById('abanico').remove();
</script>
</body></html>
