<!doctype html>
<html><head><meta charset="utf-8">
<!-- El rótulo de un Short: transparente, 1080x1920, va encima del mandala vertical.
     Parámetros por URL: hz, frase, pie. Lo usa hacer_short.py. -->
<style>
  @font-face{font-family:Inter;font-weight:900;src:url(../miniaturas/fuentes/inter-900-latin.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:600;src:url(../miniaturas/fuentes/inter-600-latin.woff2) format('woff2')}
  @font-face{font-family:Cinzel;font-weight:600;src:url(../miniaturas/fuentes/cinzel-600-normal-latin.woff2) format('woff2')}
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
  /* Zonas seguras de Shorts: arriba ~220 px de interfaz, abajo ~480 px (título,
     canal, enlace), a la derecha ~140 px (botones). Todo el texto va en el
     centro-alto y en una franja por encima de la interfaz de abajo. */
  .arriba{position:absolute;top:250px;left:70px;right:70px;text-align:center}
  .hz{font-family:Inter,sans-serif;font-weight:900;font-size:190px;line-height:1;color:#fff;
      text-shadow:0 6px 40px rgba(0,0,0,.85)}
  .frase{display:inline-block;margin-top:26px;padding:10px 30px;border-radius:999px;background:rgba(0,0,0,.45);font-family:Inter,sans-serif;font-weight:600;font-size:54px;line-height:1.2;
      color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.95)}
  .abajo{position:absolute;top:1330px;left:70px;right:150px;text-align:center}
  .pie{display:inline-block;padding:16px 34px;border-radius:999px;background:rgba(0,0,0,.55);
      font-family:Inter,sans-serif;font-weight:600;font-size:38px;color:#fff}
  .marca{margin-top:22px;font-family:Cinzel,serif;font-weight:600;font-size:40px;color:#f6e7b8;
      text-shadow:0 2px 10px rgba(0,0,0,.9)}
</style></head>
<body>
  <div class="arriba"><div class="hz" id="hz"></div><div class="frase" id="frase"></div></div>
  <div class="abajo"><div class="pie" id="pie"></div><div class="marca">Rin</div></div>
<script>
  const Q = new URLSearchParams(location.search);
  document.getElementById('hz').textContent = (Q.get('hz') || '528') + ' Hz';
  document.getElementById('frase').textContent = Q.get('frase') || '';
  document.getElementById('pie').textContent = Q.get('pie') || '';
</script>
</body></html>
