<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Rin · mandala</title>
<style>html,body{margin:0;background:#070f16;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
/*
 * Fondo caleidoscópico para los videos de Rin.
 *
 * Anillos concéntricos de motivos (pétalos, burbujas doradas, festones, hojas)
 * que llenan la pantalla hasta las esquinas. Todo lo que se mueve es periódico
 * en L segundos con un número entero de ciclos, y cada anillo gira exactamente
 * un paso de su motivo por bucle: el último fotograma empalma con el primero
 * sin costura, y el bucle se repite con -stream_loop.
 *
 * L = 48 s: cuatro respiraciones a 5 por minuto, el mismo pulso de la música.
 *
 * pintar(t) dibuja el instante t. No depende del reloj: el render le pide
 * cada fotograma, así que el resultado es determinista.
 */
const L = 48, N = 12, GAJO = 2 * Math.PI / N;
// Parámetros por URL, para reutilizar el mismo diseño en el banner y el perfil:
// ?w=2560&h=1440&r=0.4&firma=0&vineta=0.9
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), cx = cv.getContext('2d');
cv.width = +(Q.get('w') || 1920); cv.height = +(Q.get('h') || 1080);
const W = cv.width, H = cv.height, R = H * +(Q.get('r') || 0.5);
const FIRMA = Q.get('firma') !== '0', VINETA = +(Q.get('vineta') || 0.75);
// Una paleta por ambiente: cada video del canal se distingue del anterior a
// primera vista, como hace Meditative Mind. ?paleta=mar|mar-aves|zen|selva|lluvia-tambor
const PALETAS = {
  'mar': { fondo1: '#0b1c26', fondo2: '#050b10', turquesa: '#2a8f9b', turquesaClaro: '#58c1c4',
    petroleo: '#154d59', oro: '#e6c46a', crema: '#f6e7b8', rosa: '#c65a72', azul: '#223d6b' },
  // Cielo de mañana: azul claro y durazno. Tiene que distinguirse de 'mar'
  // (turquesa oscuro) y de 'zen' (rojo) en una miniatura de 160 px; en turquesa
  // se confundía con el mar y en coral con el templo.
  'mar-aves': { fondo1: '#1b3a5c', fondo2: '#0b1a2e', turquesa: '#5fa8d8', turquesaClaro: '#a8d6f0',
    petroleo: '#2b5f8f', oro: '#f5c877', crema: '#fdf1d8', rosa: '#f09a7a', azul: '#1d3b66' },
  'zen': { fondo1: '#1f0b10', fondo2: '#0c0406', turquesa: '#9e2f3c', turquesaClaro: '#d4636b',
    petroleo: '#5a1a24', oro: '#e8c066', crema: '#f7e3b5', rosa: '#f09a5a', azul: '#3a1f3f' },
  'selva': { fondo1: '#0b1f14', fondo2: '#040b07', turquesa: '#2f8f5b', turquesaClaro: '#7cc88f',
    petroleo: '#1a4f35', oro: '#e8c55e', crema: '#f3ecc0', rosa: '#e07a4f', azul: '#1f4d4a' },
  'lluvia-tambor': { fondo1: '#12112b', fondo2: '#06060f', turquesa: '#4b4fa3', turquesaClaro: '#8e8fe0',
    petroleo: '#2a2b66', oro: '#e9b35a', crema: '#f1e2c4', rosa: '#c9608a', azul: '#2a1f55' },
};
const PALETA = PALETAS[Q.get('paleta')] ? Q.get('paleta') : 'mar';
// ?tono=grados gira el matiz de la paleta (menos el oro y la crema, que son
// la firma de Rin): cada obra de un mismo ambiente tiene su propio color.
const TONO = +(Q.get('tono') || 0);
function girar(hex, g) {
  let r = parseInt(hex.slice(1, 3), 16) / 255, v = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, v, b), mn = Math.min(r, v, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (v - b) / d + (v < b ? 6 : 0) : mx === v ? (b - r) / d + 2 : (r - v) / d + 4;
    h *= 60;
  }
  h = ((h + g) % 360 + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [a1, a2, a3] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
                     : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return '#' + [a1, a2, a3].map(t => Math.round((t + m) * 255).toString(16).padStart(2, '0')).join('');
}
const C = Object.fromEntries(Object.entries(PALETAS[PALETA]).map(([k, hex]) =>
  [k, TONO && !['oro', 'crema'].includes(k) ? girar(hex, TONO) : hex]));
// Y un ritmo por ambiente, para que dos videos seguidos no se muevan igual.
//   olas     cuántas ondas de luz por bucle (entero: el bucle sigue cerrando)
//   sentido  1 salen del centro, -1 entran hacia él, como la marea
//   brazos   0 la onda es un anillo; k > 0 es una espiral de k brazos que gira
const RITMOS = {
  'zen':           { olas: 8,  sentido: 1,  brazos: 0 },   // cada 6 s, hacia afuera
  'mar-aves':      { olas: 6,  sentido: -1, brazos: 3 },   // cada 8 s, espiral que entra
  'mar':           { olas: 4,  sentido: -1, brazos: 0 },   // cada 12 s, marea lenta
  'selva':         { olas: 8,  sentido: 1,  brazos: 5 },
  'lluvia-tambor': { olas: 12, sentido: 1,  brazos: 0 },   // cada 4 s, como el tambor
};
const RITMO = RITMOS[PALETA];
const ciclo = (t, k, fase = 0) => Math.sin(2 * Math.PI * k * t / L + fase);

function gajo(dibujar) {
  // Repite un motivo en los 12 gajos, alternando espejo: eso es lo que lo
  // vuelve caleidoscopio y no una simple rotación.
  for (let k = 0; k < N; k++) {
    cx.save(); cx.rotate(k * GAJO);
    if (k % 2) cx.scale(1, -1);
    dibujar(); cx.restore();
  }
}

function petalo(r0, r1, ancho, relleno, borde, grosor) {
  cx.beginPath();
  cx.moveTo(r0, 0);
  cx.bezierCurveTo(r0 + (r1 - r0) * 0.3, ancho, r0 + (r1 - r0) * 0.75, ancho * 0.9, r1, 0);
  cx.bezierCurveTo(r0 + (r1 - r0) * 0.75, -ancho * 0.9, r0 + (r1 - r0) * 0.3, -ancho, r0, 0);
  if (relleno) { cx.fillStyle = relleno; cx.fill(); }
  if (borde) { cx.strokeStyle = borde; cx.lineWidth = grosor; cx.stroke(); }
}

function punto(x, y, r, color, brillo) {
  cx.shadowColor = color; cx.shadowBlur = brillo;
  cx.beginPath(); cx.arc(x, y, r, 0, 2 * Math.PI); cx.fillStyle = color; cx.fill();
  cx.shadowBlur = 0;
}

// Anillos concéntricos, de adentro hacia afuera hasta pasar las esquinas.
//
// Lo hipnótico (pedido del 23/09: "más ritmo"): los anillos vecinos giran en
// sentidos opuestos y a velocidades distintas, y una ONDA sale del centro hacia
// afuera ocho veces por bucle (cada 6 s), agrandando y encendiendo cada anillo
// a su paso. Todo sigue siendo periódico en 48 s, así que el bucle empalma.
//
// Pasos por bucle: cuántos lugares de su motivo avanza cada anillo en 48 s.
// Tiene que ser entero, y en las burbujas múltiplo de 4, porque alternan color
// y latido cada 4: si no, la costura del bucle salta.
// Cada anillo repite su motivo M veces y gira exactamente un paso (2π/M) por
// bucle, en un sentido o en el otro: por eso todo empalma sin costura. Que los
// anillos vecinos giren al revés es lo que da el efecto hipnótico de
// Meditative Mind sin que nada se mueva rápido.
const ANILLOS = [
  // radio, cantidad, motivo, sentido, pasos por bucle
  [0.15, 12, 'petaloOro', 1, 3],
  [0.24, 24, 'cuenta', -1, 4],
  [0.36, 12, 'loto', 1, 2],
  [0.36, 12, 'lotoFino', 1, 2],
  [0.52, 36, 'burbuja', -1, 8],
  [0.60, 24, 'festón', 1, 4],
  [0.72, 12, 'hoja', -1, 2],
  [0.72, 24, 'cuentaRosa', -1, 4],
  [0.88, 48, 'burbuja', 1, 8],
  [0.98, 24, 'loto', -1, 3],
  [1.18, 36, 'festón', 1, 4],
  [1.30, 18, 'hojaGrande', -1, 2],
  [1.52, 60, 'burbuja', -1, 8],
  [1.62, 24, 'loto', 1, 3],
  [1.88, 30, 'hojaGrande', 1, 2],
  [2.02, 72, 'burbuja', -1, 8],
];

let OLA = 1;     // la onda que sale del centro, calculada por anillo en pintar()

function motivo(tipo, r, M, t, i) {
  const paso = 2 * Math.PI / M, w = r * paso * OLA;
  const abre = (1 + 0.16 * ciclo(t, 4, r * 3)) * OLA;
  switch (tipo) {
    case 'petaloOro':
      petalo(0, r * R, w * R * 0.28 * abre, C.oro, C.crema, 1.2); break;
    case 'cuenta':
      punto(r * R, 0, R * 0.011, C.crema, 10); break;
    case 'cuentaRosa':
      punto(r * R, w * R * 0.5, R * 0.012, C.rosa, 8); break;
    case 'burbuja': {
      const d = R * w * 0.34 * (1 + 0.3 * ciclo(t, 4, (i % 4) * 0.7));
      cx.globalAlpha = 0.9;
      punto(r * R, 0, d, i % 4 ? C.oro : C.crema, 0);
      punto(r * R, 0, d * 0.45, 'rgba(255,248,220,0.8)', 0);
      cx.globalAlpha = 1; break;
    }
    case 'loto':
      petalo((r - 0.13) * R, (r + 0.13) * R, w * R * 0.42 * abre, C.turquesa, C.oro, 1.8); break;
    case 'lotoFino':
      petalo((r - 0.09) * R, (r + 0.07) * R, w * R * 0.2 * abre, C.turquesaClaro, null, 0); break;
    case 'festón':
      cx.strokeStyle = C.oro; cx.lineWidth = 1.4; cx.globalAlpha = 0.8;
      cx.beginPath(); cx.arc(r * R, 0, w * R * 0.5, -Math.PI / 2, Math.PI / 2); cx.stroke();
      cx.globalAlpha = 1; break;
    case 'hoja':
      petalo((r - 0.1) * R, (r + 0.12) * R, w * R * 0.45, C.petroleo, C.turquesaClaro, 1.4);
      petalo((r - 0.06) * R, (r + 0.08) * R, w * R * 0.18, C.azul, null, 0); break;
    case 'hojaGrande':
      cx.globalAlpha = 0.7;
      petalo((r - 0.18) * R, (r + 0.2) * R, w * R * 0.46 * abre, C.petroleo, C.turquesa, 1.6);
      petalo((r - 0.1) * R, (r + 0.12) * R, w * R * 0.2, C.azul, C.oro, 1);
      cx.globalAlpha = 1; break;
  }
}

window.pintar = function (t) {
  const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.62);
  g.addColorStop(0, C.fondo1); g.addColorStop(1, C.fondo2);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  const respira = 1 + 0.05 * ciclo(t, 4);      // cuatro respiraciones por bucle
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(respira, respira);
  // De afuera hacia adentro: lo del centro queda encima.
  for (let a = ANILLOS.length - 1; a >= 0; a--) {
    const [r, M, tipo, sentido, pasos = 1] = ANILLOS[a];
    const giro = sentido * pasos * (t / L) * (2 * Math.PI / M);
    for (let i = 0; i < M; i++) {
      const angulo = giro + i * 2 * Math.PI / M;
      // la cresta recorre los anillos hacia afuera o hacia adentro; con brazos,
      // además depende del ángulo y dibuja una espiral
      const cresta = Math.max(0, Math.sin(2 * Math.PI * RITMO.olas * t / L
                                          - RITMO.sentido * r * 4.2 + RITMO.brazos * angulo));
      OLA = 1 + 0.14 * cresta * cresta;
      cx.globalAlpha = 0.78 + 0.22 * cresta;
      cx.save(); cx.rotate(angulo);
      motivo(tipo, r, M, t, i);
      cx.restore();
    }
  }
  cx.globalAlpha = 1; OLA = 1;
  punto(0, 0, R * 0.045, C.crema, 40);
  cx.restore();

  // Viñeta: oscurece los bordes para que el ojo vuelva al centro.
  // Con min/max el mismo código sirve en horizontal y en vertical (Shorts):
  // en horizontal da exactamente H * 0.35 y W * 0.62, como antes.
  const v = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.62);
  v.addColorStop(0, 'rgba(5,11,16,0)'); v.addColorStop(1, `rgba(5,11,16,${VINETA})`);
  cx.fillStyle = v; cx.fillRect(0, 0, W, H);

  // Firma, discreta, abajo a la izquierda.
  if (!FIRMA) return;
  cx.save();
  cx.globalAlpha = 0.85; cx.strokeStyle = C.crema; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(92, H - 84, 22, 0, 2 * Math.PI); cx.stroke();
  cx.beginPath(); cx.arc(92, H - 84, 9, 0, 2 * Math.PI); cx.fillStyle = C.oro; cx.fill();
  cx.fillStyle = C.crema; cx.font = '600 34px "DejaVu Serif", Georgia, serif';
  cx.textBaseline = 'middle'; cx.fillText('Rin', 128, H - 82);
  cx.restore();
};
window.BUCLE = L;
pintar(+(Q.get('t') || 0));
</script></body></html>
