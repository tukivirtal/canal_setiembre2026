# Monta una obra del catálogo en los servidores de GitHub y deja todo como
# descarga en una Release con el nombre de la obra (OBRA-020, ...):
#   el video largo, la miniatura, los 7 Shorts y textos.txt con lo que se pega.
# Además sube los Shorts livianos (bajo 5 MB) a la rama «shorts», de donde los
# toma Make para subirlos a YouTube.
#
# Se lanza de dos maneras:
#   - Actions → «Montar una obra» → Run workflow → escribir OBRA-020
#   - subiendo un archivo 05-produccion/pedidos/OBRA-020.txt
#   - con «shorts» (p. ej. «6 7»): solo esos Shorts de una obra que ya tiene
#     Release; baja el video de ahí en lugar de volver a componerlo
#
# Por qué acá y no en la sesión de Claude: una Release admite archivos de hasta
# 2 GB (el repositorio, 100 MB), y como el repositorio es público los minutos de
# Actions no se cobran.
name: Montar una obra

on:
  workflow_dispatch:
    inputs:
      obra:
        description: "Id del catálogo, por ejemplo OBRA-020"
        required: true
      shorts:
        description: "Solo estos Shorts de una obra ya montada, por ejemplo: 6 7 (vacío = montar todo)"
        required: false
        default: ""
  push:
    paths:
      - "05-produccion/pedidos/*.txt"

permissions:
  contents: write

concurrency:
  group: montar
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Qué obra
        id: obra
        run: |
          OBRA="${{ github.event.inputs.obra }}"
          if [ -z "$OBRA" ]; then
            OBRA=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 05-produccion/pedidos | head -1 | xargs -r basename | sed 's/\.txt$//')
          fi
          if ! grep -q "^$OBRA," 08-catalogo/catalogo.csv; then
            echo "«$OBRA» no está en el catálogo"; exit 1
          fi
          echo "obra=$OBRA" >> "$GITHUB_OUTPUT"
          echo "Obra: $OBRA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q playwright
          python -m playwright install --with-deps chromium

      # Los bucles del mandala tardan ~25 min por paleta y tono: se guardan entre
      # corridas. Su nombre ya dice paleta y tono; si cambia el DIBUJO del
      # mandala, subir la versión (v1 → v2) para que se rendericen de nuevo.
      - uses: actions/cache@v4
        with:
          path: 05-produccion/fondo-mandala/bucles
          key: bucles-v1-${{ github.run_id }}
          restore-keys: |
            bucles-v1-

      - name: Solo Shorts - traer el video de su Release
        if: github.event.inputs.shorts != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OBRA=${{ steps.obra.outputs.obra }}
          mkdir -p produccion/$OBRA
          gh release download "$OBRA" -p "$OBRA-video.mp4" -p "$OBRA-miniatura.jpg" -D produccion/$OBRA
          mv produccion/$OBRA/$OBRA-video.mp4 produccion/$OBRA/video.mp4
          mv produccion/$OBRA/$OBRA-miniatura.jpg produccion/$OBRA/miniatura.jpg

      - name: Video largo
        run: python3 05-produccion/montar.py ${{ steps.obra.outputs.obra }}

      - name: Shorts
        run: python3 05-produccion/shorts/hacer_short.py ${{ steps.obra.outputs.obra }} ${{ github.event.inputs.shorts != '' && format('--n {0}', github.event.inputs.shorts) || '' }}

      - name: Textos
        run: python3 05-produccion/entrega.py ${{ steps.obra.outputs.obra }}

      - name: Release con la entrega
        if: github.event.inputs.shorts == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OBRA=${{ steps.obra.outputs.obra }}
          D=produccion/$OBRA
          mkdir -p dist
          cp $D/video.mp4 dist/$OBRA-video.mp4
          cp $D/miniatura.jpg dist/$OBRA-miniatura.jpg
          cp $D/textos.txt dist/$OBRA-textos.txt
          cp $D/metadatos.json dist/$OBRA-metadatos.json
          for f in $D/short-?.mp4; do cp $f dist/$OBRA-$(basename $f); done
          TITULO=$(python3 -c "import json;print(json.load(open('$D/metadatos.json'))['title'])")
          gh release delete "$OBRA" -y --cleanup-tag 2>/dev/null || true
          gh release create "$OBRA" dist/* --title "$OBRA · $TITULO" --notes-file $D/textos.txt --target "$GITHUB_SHA"
          ls -l dist

      - name: Solo Shorts - sumarlos a la Release
        if: github.event.inputs.shorts != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OBRA=${{ steps.obra.outputs.obra }}
          D=produccion/$OBRA
          mkdir -p dist
          for f in $D/short-?.mp4; do cp $f dist/$OBRA-$(basename $f); done
          cp $D/textos.txt dist/$OBRA-textos.txt
          gh release upload "$OBRA" dist/* --clobber
          ls -l dist

      - name: Shorts livianos a la rama «shorts»
        run: |
          OBRA=${{ steps.obra.outputs.obra }}
          git config user.name "rin-montaje"
          git config user.email "rin-montaje@users.noreply.github.com"
          git fetch -q origin shorts
          git worktree add -q /tmp/shorts origin/shorts
          mkdir -p /tmp/shorts/$OBRA
          cp produccion/$OBRA/short-*-web.mp4 /tmp/shorts/$OBRA/
          cd /tmp/shorts
          git add -A
          git commit -q -m "Shorts livianos de $OBRA" || echo "sin cambios"
          git push -q origin HEAD:shorts
